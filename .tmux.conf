# improve colors
set -g default-terminal 'xterm-256color'
set -ga terminal-overrides ",*256col*:Tc"

set -g focus-events on

# use zsh
set-option -g default-shell /bin/zsh

# those who don't remember history are doomed to repeat it
set-option -g history-limit 10000

# Send prefix
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix
set -g base-index 1

# act like vim
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# set easier window split keys
bind-key f split-window -h -c "#{pane_current_path}"
bind-key v split-window -v -c "#{pane_current_path}"

# easy config reload
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# allow mouse usage
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# shift + arrows to resize pane
bind -n S-Left resize-pane -L 1
bind -n S-Right resize-pane -R 1
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# status Bar
set -g status on

# soften status bar colors
# Tokyonight
set -g status-bg '#222334'
set -g status-fg '#cad2f2'
# Palenight
# set -g status-bg '#292d3e'
# set -g status-fg '#959dcb'

# remove administrative debris (session name, hostname, time) in status bar
set -g status-left ''
set -g status-right ''

set -g status-justify centre
set-option -g status-left-length 50
set-option -g status-right-length 120          # default 40/100 truncates once several Claude sessions are open
set-option -g status-right "#(~/dotfiles/scripts/claude-tmux-status.sh) | #[fg=cyan]#(~/dotfiles/scripts/kube_context.sh)#[default] | #(date '+%a, %b %d - %I:%M')"
set -g status-left "🌈 #(top -l 1 | grep -E "^CPU" | sed 's/.*://')"

# Get statusbar colors from the local conf
source-file ~/dotfiles/.tmux-local.conf

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange
set-option -g pane-active-border-style fg=blue

# clock
set-window-option -g clock-mode-colour colour64 #green

# bell
set-window-option -g window-status-bell-style fg=colour235,bg=colour160 #base02, red

# sync with vim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
# bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
# bind-key -T copy-mode-vi C-\ select-pane -l

# print out the pid of the running yarn process
# set -g status-left "#(ps aux | grep 'yarn start' | awk '{ print $2}' | awk 'NR==2')"

set-window-option -g window-status-current-style fg=blue,bg='#222334',bright

# --- Claude status indicator: collapse a finished instance's ✅ into 👁 once
# you focus its pane, and retract its persistent alert (claude-mark-viewed.sh).
# focus-events is already on (top of file), needed for client-focus-in to fire.
set-hook -g after-select-pane      'run-shell -b "$HOME/dotfiles/scripts/claude-mark-viewed.sh"'
set-hook -g after-select-window    'run-shell -b "$HOME/dotfiles/scripts/claude-mark-viewed.sh"'
set-hook -g client-session-changed 'run-shell -b "$HOME/dotfiles/scripts/claude-mark-viewed.sh"'
set-hook -g client-attached        'run-shell -b "$HOME/dotfiles/scripts/claude-mark-viewed.sh"'
set-hook -g client-focus-in        'run-shell -b "$HOME/dotfiles/scripts/claude-mark-viewed.sh"'

# Jump straight to any live Claude instance's pane. Opens (or refocuses) a
# persistent "claude-switcher" window -- jumping doesn't close it; Esc/Ctrl-C does.
bind-key a run-shell -b "$HOME/dotfiles/scripts/claude-switcher-open.sh"

# Use Prefix + m to prompt for a index number and move the window
bind-key m command-prompt -p "Move window to index:" "move-window -t '%%'"
